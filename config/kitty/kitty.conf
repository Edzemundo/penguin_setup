# kitty terminal configuration
# Installed to ~/.config/kitty/kitty.conf
# Reference: https://sw.kovidgoyal.net/kitty/conf/
#
# Managed by penguin_setup: this file is overwritten by `sync.sh pull`.
# Kitty reloads it on ctrl+shift+F5, or automatically if you set
# `allow_remote_control`.

# Drop kitty's own title bar and keep only the OS one. On macOS this leaves
# the traffic-light buttons; on Linux it removes the decoration entirely.
hide_window_decorations titlebar-only

# Semi-transparent background. Requires a compositor on Linux; on macOS it
# works out of the box.
background_opacity 0.50

# A bare dot means "whatever the OS says my login shell is", so kitty follows
# chsh rather than needing fish hardcoded here.
shell .

# Theme is intentionally not included. theme.conf ships alongside this file
# but is left unloaded -- uncomment to use it, or run `kitty +kitten themes`
# to pick a different one.
# include ./theme.conf

# Never prompt when closing a window, even with running processes.
confirm_os_window_close 0

# Font. Needs a Nerd Font build for the icons in eza, lazygit and fastfetch
# to render; plain MesloLG will show tofu instead.
font_family       MesloLGLNerdFont
font_size 15
