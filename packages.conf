# penguin_setup manifest
#
# This is the file you edit when things change. Everything that gets
# installed or synced is listed here; the scripts contain no package names.
#
# Sourced as bash, so: comments with #, one entry per line, quote anything
# containing a glob or space.
#
# Which package manager gets what:
#   native (apt/dnf/pacman)  build dependencies and system integration
#   homebrew                 user-facing CLI tools, same versions everywhere
#   AUR (paru/yay)           Arch only, and only what no repo carries
# Keep tools out of the native lists if brew already provides them, otherwise
# you get two copies at different versions and the PATH decides which wins.

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------

# Homebrew, installed on both macOS and Linux.
BREW_PACKAGES=(
  atuin       # shell history: sync, search, stats
  bat         # cat with syntax highlighting
  dust        # disk usage, sorted by size
  eza         # ls replacement with git status and icons
  fastfetch   # system info banner
  fd          # find replacement
  fzf         # fuzzy finder
  lazydocker  # docker TUI
  lazygit     # git TUI
  neovim      # editor
  ripgrep     # recursive grep
  yazi        # file manager
  zellij      # terminal multiplexer
  zoxide      # cd that learns your habits
)

# Extra brew formulae for Linux only. Additive to BREW_PACKAGES above --
# not a second copy of the list. macOS gets these from the Xcode toolchain.
BREW_PACKAGES_LINUX=(
  gcc
)

# Homebrew casks (macOS GUI apps). Skipped when --headless.
BREW_CASKS=()

# Debian / Ubuntu
APT_PACKAGES=(
  build-essential
  btop
  curl
  gh
  git
  libsqlite3-dev
  luarocks
  nano
  npm
  rsync
)

# Fedora / RHEL
DNF_PACKAGES=(
  btop
  curl
  gh
  git
  luarocks
  nano
  nodejs
  npm
  rsync
  sqlite-devel
  vim
)

DNF_GROUPS=(
  development-tools
)

# Arch / CachyOS / Manjaro
#
# A fresh CachyOS install already has most of this list. Leaving the entries
# here costs nothing -- installs go through pacman --needed, so an
# already-present package is not touched -- and keeps the list honest about
# what the setup depends on rather than what one distro happens to preinstall.
PACMAN_PACKAGES=(
  base-devel
  btop
  curl
  git
  github-cli
  luarocks
  nano
  nodejs
  npm
  rsync
  sqlite
)

# Arch desktop packages. Skipped when --headless.
PACMAN_DESKTOP_PACKAGES=(
  ghostty
  zed
)

# Built from the AUR by paru or yay, on Arch and its derivatives only. Ignored
# everywhere else, and skipped entirely by --skip=aur.
#
# Reach for a repo package first. An AUR entry is third-party source compiled
# on this machine on every version bump, so it is worth the line here only for
# something the repos genuinely do not carry.
AUR_PACKAGES=(
)

# ---------------------------------------------------------------------------
# Config directories
# ---------------------------------------------------------------------------
#
# Each entry is a directory name under config/, synced to ~/.config/<name>.
# Optional tags after a colon restrict where it applies:
#
#   desktop   skip when --headless
#   linux     Linux only
#   macos     macOS only
#
# Combine with commas; all tags must match. No tags means everywhere.

CONFIGS=(
  atuin
  btop
  fish
  git
  nvim
  yazi
  zellij
  ghostty:desktop
  kitty:desktop
  zed:desktop

  # Wayland/Hyprland configs were removed along with the Omarchy coupling.
  # To bring them back, restore the directory under config/ and add:
  #   hypr:desktop,linux
  #   waybar:desktop,linux
)

# ---------------------------------------------------------------------------
# Sync excludes
# ---------------------------------------------------------------------------
#
# Patterns are rsync filter rules, applied in BOTH directions. An excluded
# path is protected on both ends: --delete will never remove it. That is what
# makes syncing safe, so anything machine-local belongs here.
#
# Per-directory lists are named EXCLUDES_<config name>.

SYNC_EXCLUDES_GLOBAL=(
  '.git/'
  '.DS_Store'
  '*.swp'
  '*.bak'
  '*~'
)

# fisher installs plugins into functions/, completions/ and conf.d/; the repo
# tracks only config.fish and fish_plugins. Without these, a push would drag
# in every plugin file plus machine-local fish_variables.
EXCLUDES_fish=(
  fish_variables
  fish_history
  functions/
  completions/
  conf.d/
  themes/
)

# lazy-lock.json pins plugin commits per machine and churns constantly.
EXCLUDES_nvim=(
  lazy-lock.json
  spell/
  shada/
  .netrwhist
)

# The history database and sync key must never reach the repo.
EXCLUDES_atuin=(
  'history.db*'
  key
  session
)

EXCLUDES_zed=(
  db/
  extensions/
  conversations/
  prompts/
  themes/
  languages/
)

# Written by setup.sh, holds your git identity and credential helper.
EXCLUDES_git=(
  config.local
)

EXCLUDES_btop=(
  btop.log
)
